name: Freeze prototype version
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: freeze-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    if: ${{ !contains(github.ref_name, '-rc-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check && pnpm lint && pnpm test
      - name: Restore published snapshots
        run: node scripts/restore-snapshots.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Freeze exact tag build
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm snapshot -- "$RELEASE_VERSION"
      - name: Publish immutable archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/publish-archive.mjs "$RELEASE_VERSION"
      - name: Assemble complete site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .prototype-archives
          node scripts/restore-snapshots.mjs
          pnpm build:site
          pnpm check:site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prototype-site
          path: dist/
          retention-days: 30
