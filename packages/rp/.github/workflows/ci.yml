name: Check and build prototype
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  issues: read
  discussions: read
  contents: read
concurrency:
  group: prototype-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - name: Prevent changes to finalized notes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          PROTOTYPE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$PROTOTYPE_BASE_REF:prototype/releases.json" 2>/dev/null; then
            pnpm version:check
          fi
      - run: pnpm lint
      - run: pnpm test
      - name: Restore published snapshots
        if: github.event_name != 'pull_request'
        run: node scripts/restore-snapshots.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check live release approvals and sync handoff
        if: github.event_name != 'pull_request'
        run: pnpm release:check && pnpm handoff:sync
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm build:site
      - run: pnpm check:site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prototype-site
          path: dist/
          retention-days: 30

      - name: Deploy verified main artifact
        if: github.event_name != 'pull_request'
        run: node scripts/deploy-static.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
