name: 发布前端组件包到 npmjs.org

on:
  push:
    tags:
      - 'semi-components-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: 校验标签与包版本
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#semi-components-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'tag 必须形如 semi-components-v1.2.3'; exit 1; }
          WEB_VERSION="$version" node -e "if (require('./packages/semi-components/package.json').version !== process.env.WEB_VERSION) process.exit(1)"
          git merge-base --is-ancestor HEAD origin/main || { echo '发布标签必须指向 main 已合入的提交'; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: 构建组件包
        working-directory: packages/semi-components
        run: npm run build
      - name: 前端门禁
        run: |
          pnpm lint
          pnpm test
          node openspec/check.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@weiran-tech'
      - name: 安装支持可信发布的 npm CLI
        run: npm install --global npm@^11.5.1
      - name: 发布到 npmjs.org
        working-directory: packages/semi-components
        run: npm publish --access public
