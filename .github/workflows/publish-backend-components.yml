name: 发布前端组件包

on:
  push:
    tags:
      - 'backend-components-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: 校验标签与包版本
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#backend-components-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'tag 必须形如 backend-components-v1.2.3'; exit 1; }
          WEB_VERSION="$version" node -e "if (require('./packages/backend-components/package.json').version !== process.env.WEB_VERSION) process.exit(1)"
          git merge-base --is-ancestor HEAD origin/main || { echo '发布标签必须指向 main 已合入的提交'; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: 构建组件包
        working-directory: packages/backend-components
        run: npm run build
      - name: 前端门禁
        run: |
          pnpm lint
          pnpm test
          node openspec/check.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@weiran-tech'
      - name: 发布到 GitHub Packages
        working-directory: packages/backend-components
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
